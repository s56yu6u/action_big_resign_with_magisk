name: sign-one-partition-only-magisk

on:
  workflow_dispatch:
    inputs:
      IMG_URL:    
        description: 'URL of image'
        required: true
        default: ''
      PART_NAME:    
        description: 'partition name of your image (eg. boot/recovery)'
        required: true
        default: ''
      PART_SIZE:    
        description: 'partition size (unit: mb)'
        required: false
      EXTRA_KEY_TREE_URL:
        description: 'EXTRA_KEY_TREE_URL (leave blank if you only use unisoc keys)'
        required: false
      EXTRA_KEY_BRANCH:
        description: 'EXTRA_KEY_BRANCH (leave blank if you only use unisoc keys)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: main
        path: main

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.EXTRA_KEY_TREE_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.10.0
      with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Clone extra keys
      if: |
        github.event.inputs.EXTRA_KEY_TREE_URL != null
        && github.event.inputs.EXTRA_KEY_BRANCH != null
      run: |
        git clone ${{ github.event.inputs.EXTRA_KEY_TREE_URL }} -b ${{ github.event.inputs.EXTRA_KEY_BRANCH }} ./extra_key

    - name: patch
      run: |
        sudo apt update
        sudo apt -y install build-essential openssl curl wget busybox xz-utils python3
        # install static 7zz used below instead of busybox unzip:
        # latest official ip7z/7zip linux-x64 release (resolved via GitHub API),
        # falling back to the mcmilk/7-Zip-zstd nightly linux-clang-x64 build
        chmod +x main/setup-7zz.sh
        ./main/setup-7zz.sh
        # build avbctl, the static C replacement for the python2 avbtool
        # (fetches mbedtls-3.6 and links it statically)
        make -C main/avbctl
                curl -fL --retry 3 -o magisk.apk \
          https://github.com/topjohnwu/Magisk/releases/download/v31.0/Magisk-v31.0.apk
        test -s magisk.apk || { echo "ERROR: Magisk APK is empty"; exit 1; }
        echo "2c8a488b9a5293e578e95ae4f07e3c57aba4feec4a52ca4dd852a2692d6dd4e8  magisk.apk" | sha256sum -c - || exit 1
        wget https://raw.githubusercontent.com/magojohnji/magiskboot-linux/main/x86_64/magiskboot
        chmod +x magiskboot
        mkdir -p boot/zzz
        mkdir work
        mv main/boot_patch.sh boot/
        mv main/sign_avb.sh work/
        chmod +x boot/*
        chmod +x work/*
        # 7zz exit code 1 = warnings only (archive still fully extracted), tolerate it like unzip did
        7zz x -y -bd -oboot/zzz/ magisk.apk || [ "$?" -eq 1 ]
        curl -o boot/boot.img -L "${{ github.event.inputs.IMG_URL }}"
        cp main/avbctl/avbctl work/
        cp main/config/*.pem work/
        cp -f work/rsa4096_boot.pem work/rsa4096_dtb.pem
        cp -f work/rsa4096_boot.pem work/rsa4096_dtbo.pem
        if [ -d extra_key ]; then cp -f extra_key/*.pem work/; fi
        cd boot
        ./boot_patch.sh ${{ github.event.inputs.PART_SIZE }}
        echo "Checking Magisk payload"
        ls -l zzz/lib/arm64-v8a/libmagisk.so magisk.xz
        test -s zzz/lib/arm64-v8a/libmagisk.so || { echo "ERROR: libmagisk.so missing or empty"; exit 1; }
        test -s magisk.xz || { echo "ERROR: magisk.xz missing or empty"; exit 1; }
        xz -t magisk.xz || { echo "ERROR: magisk.xz is invalid"; exit 1; }
                # 从重新打包的镜像中取回载荷，与打包前的文件逐字节比较
        mkdir -p verify-image
        cp patched.img verify-image/
        cd verify-image
        ../../magiskboot unpack patched.img
        test -s ramdisk.cpio || { echo "ERROR: packed image has no ramdisk"; exit 1; }
        ../../magiskboot cpio ramdisk.cpio "extract overlay.d/sbin/magisk.xz extracted-magisk.xz"
        test -s extracted-magisk.xz || { echo "ERROR: magisk.xz missing from packed ramdisk"; exit 1; }
        xz -t extracted-magisk.xz || { echo "ERROR: packed magisk.xz is invalid"; exit 1; }
        cmp ../magisk.xz extracted-magisk.xz || { echo "ERROR: packed payload differs"; exit 1; }
        echo "PASS: packed image contains identical Magisk payload"
        cd ..
        cd ../work
        ./sign_avb.sh ${{ github.event.inputs.PART_NAME }} ../boot/boot.img ../boot/patched.img ${{ github.event.inputs.PART_SIZE }}
        cd ../boot
        mkdir -p verify-signed
        cp patched.img verify-signed/
        cd verify-signed
        ../../magiskboot unpack patched.img || { echo "ERROR: cannot unpack signed image"; exit 1; }
        test -s ramdisk.cpio || { echo "ERROR: signed image has no ramdisk"; exit 1; }
        ../../magiskboot cpio ramdisk.cpio "extract overlay.d/sbin/magisk.xz signed-magisk.xz" || exit 1
        test -s signed-magisk.xz || { echo "ERROR: signed image has no Magisk payload"; exit 1; }
        cmp ../magisk.xz signed-magisk.xz || { echo "ERROR: signed payload differs"; exit 1; }
        echo "PASS: signed image contains identical Magisk payload"
        cd ../..
        cp ./boot/patched.img ./image.img

    - name: Upload to Release
      uses: softprops/action-gh-release@v3
      with:
        files: | 
          image.img
        name: ${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          URL: ${{ github.event.inputs.IMG_URL }}
          PART_NAME: ${{ github.event.inputs.PART_NAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
